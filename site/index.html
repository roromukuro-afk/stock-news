<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>株ニュース</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b57c7'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <h1 class="brand">株ニュース</h1>
      <div class="top-actions">
        <span id="updated" class="updated" aria-live="polite"></span>
        <button id="btn-refresh" class="btn btn-icon" type="button" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>更新</span>
        </button>
        <button id="btn-watch" class="btn" type="button">ウォッチ</button>
        <button id="btn-sources" class="btn" type="button">取得状況</button>
      </div>
    </div>
  </header>

  <div class="wrap search-row">
    <input id="q" class="search" type="search" placeholder="見出し・銘柄・媒体を検索（/ で移動）" autocomplete="off" aria-label="検索">
  </div>

  <div class="wrap viewbar">
    <div id="view" class="seg" role="group" aria-label="表示">
      <button type="button" data-view="stocks">銘柄別</button>
      <button type="button" data-view="news">一般ニュース</button>
    </div>
  </div>

  <div id="tabs-bar" class="tabs-bar">
    <div class="wrap">
      <div id="tabs" class="tabs" role="tablist" aria-label="カテゴリ"></div>
    </div>
  </div>

  <div class="wrap filters">
    <div id="lang" class="seg" role="group" aria-label="言語">
      <button type="button" data-lang="all">すべて</button>
      <button type="button" data-lang="ja">日本語</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <div class="toggles">
      <button id="t-watch" class="toggle" type="button" aria-pressed="false">ウォッチ <span class="n"></span></button>
      <button id="t-saved" class="toggle" type="button" aria-pressed="false">あとで読む <span class="n"></span></button>
      <button id="t-unread" class="toggle" type="button" aria-pressed="false">未読のみ</button>
      <button id="t-summary" class="toggle" type="button" aria-pressed="true">要約</button>
    </div>
  </div>

  <section id="stock-view" class="wrap" hidden>
    <div id="stock-detail" hidden>
      <div class="stock-head">
        <button id="stock-back" class="btn" type="button">← 銘柄ごとに戻る</button>
        <div class="stock-title"><h2 id="stock-name"></h2><span id="stock-code" class="code"></span></div>
        <button id="stock-edit" class="btn" type="button">除外語・別名</button>
      </div>
      <div id="stock-stats" class="stat-grid"></div>
      <div id="type-chips" class="tabs" role="tablist" aria-label="種別"></div>
      <div id="kind-chips" class="tabs" role="tablist" aria-label="種類"></div>
      <div class="toggles stock-toggles">
        <button id="t-uncertain" class="toggle" type="button" aria-pressed="true">関連不確実も表示</button>
      </div>
    </div>
  </section>

  <main class="wrap">
    <div id="pinned" class="pinned" hidden></div>
    <p id="note" class="note" hidden></p>
    <div id="list" class="list" aria-live="polite"></div>
    <div class="more-wrap"><button id="btn-more" class="btn btn-wide" type="button" hidden>さらに表示</button></div>
    <details id="excluded-box" class="excluded" hidden>
      <summary id="excluded-sum"></summary>
      <p class="excl-help">除外語に当たって、この銘柄の記事から外したものです。外したのが間違いなら、除外語を直してください。</p>
      <ul id="excluded-list"></ul>
    </details>
    <section id="stock-profile" class="profile" hidden></section>
  </main>

  <dialog id="dlg-watch" aria-labelledby="dlg-watch-title">
    <form method="dialog" class="dlg-head">
      <h2 id="dlg-watch-title">ウォッチリスト</h2>
      <button class="btn" value="close">閉じる</button>
    </form>
    <p class="dlg-help">登録した銘柄の名前・別名・コードを見出しと照合し、記事を銘柄ごとに分けます。Google ニュースでもその名前を検索して集めます。除外語に当たる記事（同名の別の話題など）は外しますが、決算・M&amp;A・訴訟などの重要な語がある記事は消さずに残します。</p>
    <ul id="watch-list" class="watch-list"></ul>
    <p id="watch-hint" class="watch-hint" hidden></p>
    <form id="watch-form" class="watch-form" autocomplete="off">
      <label>名前<input name="name" required minlength="2" maxlength="40" placeholder="例: トヨタ自動車"></label>
      <label>コード（任意）<input name="code" maxlength="12" placeholder="例: 7203 / NVDA"></label>
      <label>別名（任意・カンマ区切り）<input name="aliases" maxlength="200" placeholder="例: トヨタ, Toyota"></label>
      <label>除外語（任意・カンマ区切り）<input name="exclude" maxlength="600" placeholder="例: バファローズ, 野球（同名の別の話題を外す）"></label>
      <div class="form-actions">
        <button id="watch-submit" class="btn btn-primary" type="submit">追加</button>
        <button id="watch-cancel" class="btn" type="button" hidden>編集をやめる</button>
      </div>
    </form>
    <p id="watch-msg" class="dlg-msg" role="status"></p>
  </dialog>

  <dialog id="dlg-sources" aria-labelledby="dlg-sources-title">
    <form method="dialog" class="dlg-head">
      <h2 id="dlg-sources-title">取得状況</h2>
      <button class="btn" value="close">閉じる</button>
    </form>
    <p id="sources-sum" class="dlg-help"></p>
    <ul id="sources-list" class="sources-list"></ul>
  </dialog>

  <noscript><p class="wrap note">表示には JavaScript が必要です。</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
