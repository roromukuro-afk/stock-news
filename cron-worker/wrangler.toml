name = "stock-news-cron"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false          # 公開の URL を作らない（外から呼べない）
preview_urls = false

[triggers]
crons = ["7 * * * *"]        # 毎時 7 分（UTC）

# REPO（「持ち主/リポジトリ名」）と GITHUB_TOKEN は、秘密の変数として Cloudflare にだけ置く（リポジトリには書かない）
[vars]
WORKFLOW = "update.yml"
REF = "main"
